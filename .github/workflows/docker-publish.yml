name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '0 22 * * 6'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-client-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-client-archive-keyring.gpg] https://pkg.cloudflareclient.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
      - name: Prepare Docker image build metadata
        run: |
          # CLI version output can include build information on additional lines.
          VERSION=$(dpkg-query --show --showformat='${Version}' cloudflare-warp)
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid WARP package version for a Docker tag"
            exit 1
          fi
          IMAGE_NAME="${GITHUB_ACTOR}/${GITHUB_REPOSITORY##*/}"
          IMAGE_NAME_VERSION="${IMAGE_NAME}:${VERSION}"
          printf '%s\n' "IMAGE_NAME=$IMAGE_NAME" "IMAGE_NAME_VERSION=$IMAGE_NAME_VERSION"
          printf '%s\n' "IMAGE_NAME=$IMAGE_NAME" "IMAGE_NAME_VERSION=$IMAGE_NAME_VERSION" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.IMAGE_NAME_VERSION }}, ${{ env.IMAGE_NAME }}:latest  
